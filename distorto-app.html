<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Distorto - Interactive RGB Distortion</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --background-color: #ecf0f1;
            --text-color: #34495e;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        #canvas {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            touch-action: none;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control {
            background-color: white;
            padding: 15px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transition: var(--transition);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--secondary-color);
        }

        input[type="text"],
        input[type="range"],
        input[type="color"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            background: #ddd;
            outline: none;
            opacity: 0.7;
            transition: var(--transition);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary-color);
            cursor: pointer;
            border-radius: 50%;
        }

        input[type="color"] {
            height: 40px;
            cursor: pointer;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: var(--border-radius);
            transition: var(--transition);
            margin-right: 10px;
        }

        button:hover {
            background-color: #2980b9;
        }

        #randomize { background-color: #e74c3c; }
        #randomize:hover { background-color: #c0392b; }
        #reset { background-color: #2ecc71; }
        #reset:hover { background-color: #27ae60; }

        .value-display {
            display: inline-block;
            min-width: 60px;
            text-align: right;
            margin-left: 10px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .app-title {
            text-align: center;
            font-size: 2.5em;
            color: var(--secondary-color);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .app-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background-color: var(--primary-color);
            margin: 10px auto;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 10px; }
            .controls { grid-template-columns: 1fr; }
            button { width: 100%; margin-bottom: 10px; }
            .app-title { font-size: 2em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="app-title">Distorto</h1>
        <canvas id="canvas"></canvas>
        <div class="controls">
            <div class="control">
                <label for="text-input">Text:</label>
                <input type="text" id="text-input" value="Distorto">
            </div>
            <div class="control">
                <label for="font-size">Font Size: <span id="font-size-value" class="value-display">48px</span></label>
                <input type="range" id="font-size" min="12" max="100" value="48">
            </div>
            <div class="control">
                <label for="distortion-strength">Distortion Strength: <span id="distortion-strength-value" class="value-display">1.5</span></label>
                <input type="range" id="distortion-strength" min="0" max="5" step="0.1" value="1.5">
            </div>
            <div class="control">
                <label for="distortion-radius">Distortion Radius: <span id="distortion-radius-value" class="value-display">190px</span></label>
                <input type="range" id="distortion-radius" min="50" max="500" value="190">
            </div>
            <div class="control">
                <label for="rgb-separation">RGB Separation: <span id="rgb-separation-value" class="value-display">0.025</span></label>
                <input type="range" id="rgb-separation" min="0" max="0.1" step="0.001" value="0.025">
            </div>
            <div class="control">
                <label for="iterations">Iterations: <span id="iterations-value" class="value-display">10</span></label>
                <input type="range" id="iterations" min="1" max="20" value="10">
            </div>
            <div class="control">
                <label for="background-color">Background Color:</label>
                <input type="color" id="background-color" value="#000000">
            </div>
            <div class="control">
                <label for="text-color">Text Color:</label>
                <input type="color" id="text-color" value="#ffffff">
            </div>
            <div class="control">
                <button id="randomize">Randomize</button>
                <button id="reset">Reset</button>
            </div>
        </div>
    </div>

    <script id="vertexShader" type="x-shader/x-vertex">
        attribute vec2 a_position;
        attribute vec2 a_texCoord;
        varying vec2 v_texCoord;
        void main() {
            gl_Position = vec4(a_position, 0, 1);
            v_texCoord = a_texCoord;
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        precision mediump float;
        uniform sampler2D u_image;
        uniform vec2 u_resolution;
        uniform vec2 u_mouse;
        uniform float u_distortionStrength;
        uniform float u_distortionRadius;
        uniform float u_rgbSeparation;
        uniform int u_iterations;
        varying vec2 v_texCoord;

        vec2 distort(vec2 pos, vec2 center, float strength, float radius) {
            vec2 delta = pos - center;
            float distanceFromCenter = length(delta);
            float distortionFactor = 1.0 - smoothstep(0.0, radius, distanceFromCenter);
            return pos + delta * distortionFactor * strength;
        }

        void main() {
            vec2 pos = gl_FragCoord.xy / u_resolution.xy;
            vec2 mousePos = u_mouse / u_resolution.xy;

            vec2 distortedPos = pos;
            for (int i = 0; i < 20; i++) {
                if (i >= u_iterations) break;
                distortedPos = distort(distortedPos, mousePos, u_distortionStrength / float(u_iterations), u_distortionRadius / u_resolution.x);
            }

            vec2 redPos = distort(distortedPos, mousePos, u_rgbSeparation, u_distortionRadius / u_resolution.x);
            vec2 bluePos = distort(distortedPos, mousePos, -u_rgbSeparation, u_distortionRadius / u_resolution.x);

            vec4 redChannel = texture2D(u_image, redPos);
            vec4 greenChannel = texture2D(u_image, distortedPos);
            vec4 blueChannel = texture2D(u_image, bluePos);

            gl_FragColor = vec4(redChannel.r, greenChannel.g, blueChannel.b, greenChannel.a);
        }
    </script>

    <script>
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl');

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        function createProgram(gl, vertexShader, fragmentShader) {
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            return program;
        }

        const vertexShaderSource = document.getElementById('vertexShader').text;
        const fragmentShaderSource = document.getElementById('fragmentShader').text;

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

        const program = createProgram(gl, vertexShader, fragmentShader);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        const texCoordBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, 'a_position');
        const texCoordLocation = gl.getAttribLocation(program, 'a_texCoord');

        gl.enableVertexAttribArray(positionLocation);
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        gl.enableVertexAttribArray(texCoordLocation);
        gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
        gl.vertexAttribPointer(texCoordLocation, 2, gl.FLOAT, false, 0, 0);

        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        const resolutionLocation = gl.getUniformLocation(program, 'u_resolution');
        const mouseLocation = gl.getUniformLocation(program, 'u_mouse');
        const distortionStrengthLocation = gl.getUniformLocation(program, 'u_distortionStrength');
        const distortionRadiusLocation = gl.getUniformLocation(program, 'u_distortionRadius');
        const rgbSeparationLocation = gl.getUniformLocation(program, 'u_rgbSeparation');
        const iterationsLocation = gl.getUniformLocation(program, 'u_iterations');

        let mouseX = 0, mouseY = 0;
        let isTouching = false;

        function handlePointerMove(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            mouseX = clientX - rect.left;
            mouseY = canvas.height - (clientY - rect.top);
            render();
        }

        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isTouching) {
                handlePointerMove(e);
            }
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            isTouching = true;
            handlePointerMove(e);
        });

        canvas.addEventListener('touchend', () => {
            isTouching = false;
        });

        function createTextTexture(text, fontSize, textColor, backgroundColor) {
            const offscreenCanvas = document.createElement('canvas');
            const scaleFactor = window.devicePixelRatio || 1;
            offscreenCanvas.width = canvas.width * scaleFactor;
            offscreenCanvas.height = canvas.height * scaleFactor;
            const ctx = offscreenCanvas.getContext('2d');
            ctx.scale(scaleFactor, scaleFactor);
            ctx.fillStyle = backgroundColor;
            ctx.fillRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);
            ctx.font = `${fontSize}px Arial`;
            ctx.fillStyle = textColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const lines = text.split('\\n
