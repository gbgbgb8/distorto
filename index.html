<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distorto - Interactive RGB Distortion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <meta name="theme-color" content="#3498db">
</head>
<body>
    <div class="container">
        <h1 class="app-title">Distorto</h1>
        <canvas id="canvas"></canvas>
        <div class="controls">
            <div class="control">
                <label for="text-input">Text:</label>
                <input type="text" id="text-input" value="Distorto">
            </div>
            <div class="control">
                <label for="font-size">Font Size: <span id="font-size-value">48px</span></label>
                <input type="range" id="font-size" min="12" max="100" value="48">
            </div>
            <div class="control">
                <label for="distortion-strength">Distortion Strength: <span id="distortion-strength-value">1.5</span></label>
                <input type="range" id="distortion-strength" min="0" max="5" step="0.1" value="1.5">
            </div>
            <div class="control">
                <label for="distortion-radius">Distortion Radius: <span id="distortion-radius-value">190px</span></label>
                <input type="range" id="distortion-radius" min="50" max="500" value="190">
            </div>
            <div class="control">
                <label for="rgb-separation">RGB Separation: <span id="rgb-separation-value">0.025</span></label>
                <input type="range" id="rgb-separation" min="0" max="0.1" step="0.001" value="0.025">
            </div>
            <div class="control">
                <label for="iterations">Iterations: <span id="iterations-value">10</span></label>
                <input type="range" id="iterations" min="1" max="20" value="10">
            </div>
            <div class="control">
                <label for="background-color">Background Color:</label>
                <input type="color" id="background-color" value="#000000">
            </div>
            <div class="control">
                <label for="text-color">Text Color:</label>
                <input type="color" id="text-color" value="#ffffff">
            </div>
            <div class="control">
                <button id="randomize">Randomize</button>
                <button id="reset">Reset</button>
            </div>
        </div>
    </div>
    <footer class="footer">
        <p>Created with ❤️ by gbgbgb8 | <a href="https://github.com/gbgbgb8/distorto" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <script id="vertexShader" type="x-shader/x-vertex">
        attribute vec2 a_position;
        attribute vec2 a_texCoord;
        varying vec2 v_texCoord;
        void main() {
            gl_Position = vec4(a_position, 0, 1);
            v_texCoord = a_texCoord;
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        precision mediump float;
        uniform vec2 u_resolution;
        uniform vec2 u_mouse;
        uniform float u_distortionStrength;
        uniform float u_distortionRadius;
        uniform float u_rgbSeparation;
        uniform int u_iterations;
        uniform sampler2D u_texture;
        varying vec2 v_texCoord;

        vec2 distort(vec2 pos, vec2 origin, float strength, float radius) {
            vec2 delta = pos - origin;
            float dist = length(delta);
            float factor = 1.0 - smoothstep(0.0, radius, dist);
            return pos + delta * factor * strength;
        }

        void main() {
            vec2 pos = gl_FragCoord.xy / u_resolution;
            vec2 mousePos = u_mouse / u_resolution;
            vec2 distortedPos = pos;

            for (int i = 0; i < 20; i++) {
                if (i >= u_iterations) break;
                distortedPos = distort(distortedPos, mousePos, u_distortionStrength / float(u_iterations), u_distortionRadius / u_resolution.x);
            }

            vec2 redPos = distortedPos + vec2(u_rgbSeparation, 0.0);
            vec2 greenPos = distortedPos;
            vec2 bluePos = distortedPos - vec2(u_rgbSeparation, 0.0);

            vec4 red = texture2D(u_texture, redPos);
            vec4 green = texture2D(u_texture, greenPos);
            vec4 blue = texture2D(u_texture, bluePos);

            gl_FragColor = vec4(red.r, green.g, blue.b, 1.0);
        }
    </script>

    <script src="script.js"></script>
</body>
</html>
